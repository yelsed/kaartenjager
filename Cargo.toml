[package]
name = "kaartenjager"
version = "1.5.0"
edition = "2021"
rust-version = "1.85"
description = "Watches Vinted and Marktplaats for underpriced graphics cards, power supplies and risers"
license = "MIT"
repository = "https://github.com/yelsed/kaartenjager"

[dependencies]
ureq = { version = "3.4", features = ["gzip", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
