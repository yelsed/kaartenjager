# ---------------------------------------------------------------------------
# Onderdelen. Geen rekenwerk per GB mogelijk, dus een vaste notitie in plaats
# van een berekend oordeel.
# ---------------------------------------------------------------------------

[[part]]
name = "Voeding 700 W of meer"
patterns = ["voeding", "psu", "power supply", "netzteil"]
exclude_patterns = ["laptop", "adapter", "oplader", "kabel", "cable", "snoer"]
min_watts = 700
alert_below = 90
suspicious_below = 30
note = "Let op 80 PLUS Gold of beter, volledig modulair, en maximaal 180 mm lang voor de 4000D."

[[part]]
name = "PCIe riser"
patterns = ["pcie riser", "riser kabel", "riser cable", "pci-e verleng"]
exclude_patterns = ["usb", "riser board", "riser card", "proliant", "poweredge"]
alert_below = 25
suspicious_below = 6
note = "Alleen PCIe 4.0 x16 is bruikbaar; 3.0 halveert de bandbreedte. Recht (180 graden), niet haaks."
