# Kaartenjager — configuratie
#
# Kopieer naar ~/.config/kaartenjager/kaartenjager.toml en pas aan.
# Controleren:  kaartenjager check
#
# Dit bestand is van jou. De wekelijkse prijsherziening schrijft naar
# cards.auto.toml ernaast en komt hier nooit aan. Zet je een regel hier neer,
# dan wint die altijd.

sources = ["vinted", "marktplaats"]
vinted_domain = "www.vinted.nl"

results_per_search = 60

# Tussenruimte tussen twee verzoeken. Bij rondes van vijf minuten telt dit aan:
# Vinted blokkeerde de server op 26 augustus 2026 met 1500 ms. Het programma
# rekt dit vanzelf op zodra een bron ons tegenhoudt, en laat het weer krimpen
# na een geslaagde ronde, maar begin ruim.
delay_between_requests_ms = 2500



# ---------------------------------------------------------------------------
# Zoektermen. Ook de verkeerd gespelde, want daar zit het koopje.
#
# Deze lijst wordt bij de allereerste start één keer in de database gezet;
# daarna beheer je hem in de app en kijkt het programma hier niet meer naar.
# Zo zet het weghalen van je laatste zoekterm de hele lijst niet terug.
#
# Let op de grens: (kaarten + onderdelen) x bronnen mag niet boven de 60.
# ---------------------------------------------------------------------------

card_search_terms = [
  "rtx 3090",
  "3090 ti",
  "rtx 4090",
  "rtx 5090",
  "geforce rtx",
  "videokaart 24gb",
  "tesla p40",
  "radeon rx",
  "grafische kaart",
]

part_search_terms = [
  "voeding 850w",
  "voeding 1000w",
  "pcie riser",
  "riser kabel",
]


# ---------------------------------------------------------------------------
# Wanneer een vondst het waard is om je voor te storen.
#
# Alles wat het programma vindt komt in de app te staan. Alleen echte
# uitschieters gaan óók naar Discord, en dit is waar die grens ligt: hoeveel
# procent onder de onderkant van het marktbereik.
#
# Alleen [[card]]-regels halen deze drempel; onderdelen hebben geen
# marktbereik om tegen af te zetten.
# ---------------------------------------------------------------------------

[notify]
push_below_market_percent = 35


# ---------------------------------------------------------------------------
# Hoe de ronde zich verdeelt over zoeken en volgen.
#
# Zoeken hoort vaak te gebeuren: een echt koopje op Vinted is soms binnen een
# half uur verkocht, dus elk uur kijken betekent dat je het misloopt. Zet de
# cronjob daarom op "*/5 8-22 * * *".
#
# Hercontroleren hoort dat juist niet. Dat volgt prijzen van advertenties die
# je al kent, en daar verandert niet elke vijf minuten iets aan. Zonder dit
# onderscheid zou elke ronde dertig extra verzoeken doen voor niets.
# ---------------------------------------------------------------------------

[scan]
recheck_every_minutes = 30    # hoe vaak de volledige hercontrole langsgaat
close_watch_hours = 6         # zo lang gaat een verse vondst wel elke ronde mee


# ---------------------------------------------------------------------------
# Jouw machine. Hiermee kan het programma zeggen of een kaart past en of je
# voeding hem trekt. Laat je dit blok weg, dan blijven die regels achterwege
# in plaats van dat er gegokt wordt.
# ---------------------------------------------------------------------------

[system]
psu_watts = 850
psu_name = "RM850"
other_draw_watts = 155        # 5800X, schijven, ventilatoren, waterkoeler
model_bits_per_weight = 4.8   # Q4_K_M
kv_overhead_gb = 3.0          # KV-cache plus rekenbuffers

# ---------------------------------------------------------------------------
# De kast. Hiermee kan het programma zeggen of een kaart er fysiek in past.
# Laat je dit weg, dan blijven de maatregels achterwege.
# ---------------------------------------------------------------------------

[case]
name = "4000D Airflow"
max_gpu_length_mm = 310                  # zoals hij nu staat, radiator vooraan
max_gpu_length_mm_after_work = 360       # na het verplaatsen van de radiator naar boven
work_needed = "eerst de radiator naar boven verplaatsen"
free_slots = 7


# ---------------------------------------------------------------------------
# Filters
# ---------------------------------------------------------------------------

[filters]
postcode = ""                 # INVULLEN. Zonder postcode geeft Marktplaats geen
                              # afstand terug en werkt het ophaal-filter niet.
max_pickup_km = 30            # verder weg en alleen ophalen: overslaan
skip_pickup_only = false      # true = ophalen altijd overslaan

# Zonder dit filter is een deel van de resultaten iemand die er zelf één zoekt.
wanted_words = [
  "gezocht", "ruilen", "wtb", "ter overname gevraagd",
  "zoek ik", "wie heeft", "gevraagd",
]

# Marktplaats meldt per advertentie waar hij thuishoort. Vinted doet dat niet,
# dus daar wordt dit filter overgeslagen.
card_categories = ["graphic_cards"]


# ---------------------------------------------------------------------------
# Prijstabel.
#
#   alert_below       hieronder wil je het horen
#   suspicious_below  hieronder is het vaker oplichterij dan een buitenkans
#   used_price_*      wat het model tweedehands doet, voor de "hoeveel onder
#                     de markt"-regel
#
# Een regel past als één patroon voorkomt en géén enkel exclude_pattern. De
# volgorde in dit bestand is daarmee niet bepalend.
#
# De marktprijzen hieronder zijn een startpunt van augustus 2026. De 3090,
# 3090 Ti, 4090 en 5090 zijn gecontroleerd; de rest is een schatting die de
# wekelijkse herziening bijstelt zodra er echte advertenties langskomen.
# ---------------------------------------------------------------------------

[[card]]
name = "RTX 5090"
patterns = ["5090"]
vram_gb = 32
bandwidth_gbs = 1792
tdp_watt = 575
used_price_low = 2400
used_price_high = 2900
alert_below = 2200
suspicious_below = 1500
length_mm_min = 304
length_mm_max = 360
slots_max = 4

[[card]]
name = "RTX 4090"
patterns = ["4090"]
vram_gb = 24
bandwidth_gbs = 1008
tdp_watt = 450
# Gecontroleerd op 25 augustus 2026: tien advertenties op Marktplaats stonden
# tussen 1.800 en 2.800, met het zwaartepunt rond 2.000-2.500. Een eerdere
# schatting van 1.600-2.000 was te laag en maakte een advertentie van 1.260
# een matig koopje in plaats van een uitschieter van 30% onder de markt.
used_price_low = 1800
used_price_high = 2500
alert_below = 1650
suspicious_below = 1250
length_mm_min = 304
length_mm_max = 359
slots_max = 4

[[card]]
name = "RTX 3090 Ti"
patterns = ["3090 ti", "3090ti"]
vram_gb = 24
bandwidth_gbs = 1008
tdp_watt = 450
# Gecontroleerd op 25 augustus 2026: vraagprijzen op Marktplaats stonden op
# 1.150-1.250, het Duitse tweedehandsgemiddelde op ongeveer 1.029. Een eerdere
# schatting van 950-1.050 was te laag.
used_price_low = 1050
used_price_high = 1250
alert_below = 950
suspicious_below = 600
length_mm_min = 285
length_mm_max = 340
slots_max = 3

