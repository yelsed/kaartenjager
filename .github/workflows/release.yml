name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bouwen en zelftest draaien
        run: |
          cargo build --release
          ./target/release/kaartenjager selftest

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Doelplatform toevoegen
        run: rustup target add ${{ matrix.target }}

      # musl geeft een volledig statisch bestand, zodat het niet uitmaakt welke glibc of
      # architectuur de doelserver heeft.
      - name: Bouwgereedschap voor musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Bouwen
        run: cargo build --release --target ${{ matrix.target }}

      - name: Inpakken
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="kaartenjager-${TAG}-${{ matrix.target }}.tar.gz"
          tar czf "$NAME" -C "target/${{ matrix.target }}/release" kaartenjager
          sha256sum "$NAME" > "$NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            kaartenjager-*.tar.gz
            kaartenjager-*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Controlesommen samenvoegen
        run: cat kaartenjager-*.tar.gz.sha256 > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kaartenjager-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
