name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Twee builds op dezelfde tag uploaden naar dezelfde release en rijden elkaar in de wielen:
# bij v1.6.0 hield die race een release over met alleen SHA256SUMS erin, zonder dat er ergens
# iets rood werd. Eén tegelijk per tag, en een lopende niet afbreken — die is misschien al
# halverwege het uploaden.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bouwen en zelftest draaien
        run: |
          cargo build --release
          ./target/release/kaartenjager selftest

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Doelplatform toevoegen
        run: rustup target add ${{ matrix.target }}

      # musl geeft een volledig statisch bestand, zodat het niet uitmaakt welke glibc of
      # architectuur de doelserver heeft. `cross` levert per doel een compleet C-gereedschap
      # in een container; dat is nodig sinds rusqlite de meegeleverde SQLite meecompileert,
      # en het scheelt het bij elkaar sprokkelen van cross-compilers met apt.
      - name: cross ophalen
        run: |
          VERSION=v0.2.5
          curl -fsSL "https://github.com/cross-rs/cross/releases/download/${VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin cross

      - name: Bouwen
        run: cross build --release --target ${{ matrix.target }}

      - name: Inpakken
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="kaartenjager-${TAG}-${{ matrix.target }}.tar.gz"
          tar czf "$NAME" -C "target/${{ matrix.target }}/release" kaartenjager
          sha256sum "$NAME" > "$NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            kaartenjager-*.tar.gz
            kaartenjager-*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Controlesommen samenvoegen
        run: cat kaartenjager-*.tar.gz.sha256 > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kaartenjager-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
